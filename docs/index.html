<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0d10; overflow: hidden; color: #eef1f4; font-family: system-ui, "Segoe UI", sans-serif; }
  canvas { display: block; position: fixed; inset: 0; width: 100vw; height: 100vh; }
  #screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 8vw; }
  #screen h1 { font-size: 3.2vw; font-weight: 600; margin: 0 0 2vw; }
  #screen p { font-size: 2vw; margin: 0.6vw 0; }
  #screen .dim { color: #9aa3ad; font-size: 1.6vw; }
  #screen .key { margin-top: 2.5vw; color: #ffd166; }
  #screen .code { font: 700 9vw ui-monospace, "Consolas", monospace; letter-spacing: 0.08em; color: #ffd166; margin: 1vw 0 2vw; }
  .bar { position: fixed; left: 2vw; right: 2vw; font-size: 1.5vw; padding: 0.6vw 1.2vw; background: rgba(8, 10, 14, 0.62); border-radius: 0.8vw; width: max-content; max-width: 96vw; }
  /* The world line (map, day, time, weather, people) at the bottom right, 5px from the edges, small (imad 2026-11-27). */
  #top { top: auto; bottom: 5px; left: auto; right: 5px; font-size: 1vw; padding: 0.25vw 0.7vw; border-radius: 0.5vw; background: rgba(8, 10, 14, 0.55); }
  [dir="rtl"] #top { right: auto; left: 5px; }
  #fps { position: fixed; top: 2vw; right: 2vw; padding: 0.3vw 0.7vw; border-radius: 0.5vw; background: rgba(8, 10, 14, 0.7); color: #9ff0b8; font: 600 1.1vw/1.3 system-ui, sans-serif; z-index: 5; pointer-events: none; }
  #hint { bottom: 2vw; color: #c9d1d9; }
  /* The fade into / out of the road between maps (app.ts trip): one black layer, its opacity eased by the compositor. */
  #fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity 450ms ease; z-index: 4; will-change: opacity; }
  #note { top: 9vw; left: 50%; right: auto; transform: translateX(-50%); font-size: 1.8vw; color: #ffe7a3; text-align: center; }
  #aimhud { position: fixed; left: 50%; bottom: 7vw; transform: translateX(-50%); display: flex; align-items: center; gap: 0.8vw; padding: 0.5vw 1.4vw 0.5vw 0.8vw; background: rgba(8, 10, 14, 0.7); border: 0.15vw solid rgba(255, 209, 102, 0.55); border-radius: 3vw; color: #ffe7a3; font-size: 1.4vw; z-index: 4; pointer-events: none; }
  #aimhud[hidden] { display: none; }
  /* The compass bar (imad 2026-11-27: 50 % bigger, distances twice the size) (imad 2026-11-26, "like Zelda's: a line with white icons"): JS moves the ticks / icons by translateX from the middle. */
  #compass { position: fixed; left: 50%; top: 10px; width: 38vw; max-width: 900px; height: 8vw; transform: translateX(-50%); pointer-events: none; z-index: 3; overflow: hidden;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent); mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent); }
  #compass[hidden] { display: none; }
  #compass:before { content: ''; position: absolute; left: 0; right: 0; top: 1.9vw; height: 0.2vw; background: rgba(255, 255, 255, 0.75); box-shadow: 0 0 0.3vw rgba(0, 0, 0, 0.7); }
  #compass:after { content: ''; position: absolute; left: 50%; top: 0.8vw; margin-left: -0.68vw; border: 0.68vw solid transparent; border-top: 0.82vw solid #ffd166; }
  .cp-in { position: absolute; left: 50%; top: 0; width: 0; height: 100%; }
  .cp-t, .cp-c, .cp-i { position: absolute; left: 0; top: 0; will-change: transform; }
  .cp-t { top: 1.5vw; width: 0.18vw; height: 0.9vw; margin-left: -0.09vw; background: rgba(255, 255, 255, 0.55); }
  .cp-t.big { top: 1.28vw; height: 1.35vw; background: rgba(255, 255, 255, 0.8); }
  .cp-c { top: 2.5vw; width: 3vw; margin-left: -1.5vw; text-align: center; font: 700 1.7vw/1 system-ui, sans-serif; color: #fff; text-shadow: 0 0 0.3vw #000, 0 0.1vw 0.2vw #000; }
  /* Each kind of place has its own colour (imad 2026-11-26: "each with a unique colour, a bit bigger"); --c set per kind below. */
  .cp-i { --c: #fff; top: 0; width: 10vw; margin-left: -5vw; text-align: center; }
  .cp-i svg { display: block; width: 3.75vw; height: 3.75vw; margin: 0 auto; fill: var(--c); filter: drop-shadow(0 0 0.12vw #000) drop-shadow(0 0 0.1vw #000); }
  /* Distance from me in metres (imad 2026-11-26: "show how many meters away from me"): a dark pill over the letters so it always reads. */
  .cp-i { z-index: 2; }
  .cp-i span { display: inline-block; margin-top: 0.1vw; padding: 0.15vw 0.6vw; border-radius: 0.9vw; background: rgba(10, 12, 16, 0.78); font: 700 2vw/1.1 system-ui, sans-serif; color: var(--c); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .cp-i.home { --c: #ffd166; } .cp-i.camp { --c: #ff8a3d; } .cp-i.gate { --c: #7fd3ff; } .cp-i.horse { --c: #d9a066; } .cp-i.partner { --c: #ff7eb6; }
  .cp-i.mk-home { --c: #fff3c4; } .cp-i.mk-mine { --c: #b9c6d8; } .cp-i.mk-hunt { --c: #e8735a; } .cp-i.mk-wood { --c: #6fd36a; } .cp-i.mk-water { --c: #3fa9ff; }
  .cp-i.mk-farm { --c: #d4ec5a; } .cp-i.mk-danger { --c: #ff4040; } .cp-i.mk-camp { --c: #ffb38a; } .cp-i.mk-star { --c: #c7a2ff; }
  .cp-i.gate svg { width: 3.3vw; height: 3.3vw; margin-top: 0.22vw; }
  /* Names over heads. */
  #names { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 2; }
  /* Where a sound comes from (nav.ts SoundCues): an icon on the screen's edge, a small arrow pointing out. */
  #cues { position: fixed; left: 0; top: 0; width: 0; height: 0; pointer-events: none; z-index: 3; }
  .cue { position: absolute; left: 0; top: 0; width: 3.4vw; height: 3.4vw; border-radius: 50%; background: rgba(8, 10, 14, 0.62); border: 0.14vw solid rgba(255, 140, 110, 0.75); box-shadow: 0 0 0.6vw rgba(0, 0, 0, 0.6); will-change: transform, opacity; }
  .cue[hidden] { display: none; }
  .cue .ci { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 2vw; line-height: 1; }
  .cue .ca { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
  .cue .ca:after { content: ''; position: absolute; left: 1.9vw; top: -0.55vw; border: 0.55vw solid transparent; border-left: 0.7vw solid rgba(255, 170, 140, 0.95); border-right: 0; }
  .nm { position: absolute; left: 0; top: 0; padding: 0.1vw 0.55vw; border-radius: 0.6vw; background: rgba(8, 10, 14, 0.5); color: #fff; font: 600 1.05vw/1.25 system-ui, sans-serif; white-space: nowrap; text-shadow: 0 0.08vw 0.2vw #000; will-change: transform; }
  .nm[hidden] { display: none; }
  /* What people near me say, over their heads (nav.ts Speech): above the name tag, a small tail under it. */
  #speech { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 3; }
  .sp { position: absolute; left: 0; top: 0; margin-top: -2.1vw; max-width: 24vw; padding: 0.35vw 0.8vw; border-radius: 0.9vw; background: rgba(250, 248, 240, 0.94); color: #15171c; font: 600 1.25vw/1.3 system-ui, sans-serif; text-align: center; box-shadow: 0 0.2vw 0.7vw rgba(0, 0, 0, 0.45); will-change: transform; }
  .sp:after { content: ''; position: absolute; left: 50%; bottom: -0.6vw; margin-left: -0.6vw; border: 0.6vw solid transparent; border-top-color: rgba(250, 248, 240, 0.94); border-bottom: 0; }
  .sp[hidden] { display: none; }
  #iahint { position: fixed; left: 50%; bottom: 7vw; transform: translateX(-50%); display: flex; align-items: center; gap: 0.9vw; padding: 0.45vw 1.5vw 0.45vw 0.55vw; background: rgba(8, 10, 14, 0.72); border: 0.15vw solid rgba(255, 255, 255, 0.28); border-radius: 3vw; color: #f4f1ea; font-size: 1.5vw; z-index: 4; pointer-events: none; }
  #iahint[hidden] { display: none; }
  #iahint b { min-width: 2.4vw; height: 2.4vw; padding: 0 0.5vw; box-sizing: border-box; border-radius: 1.2vw; background: #4caf6a; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 1.3vw; }
  #aimhud i { width: 48px; height: 48px; display: block; }
  #aimhud b { font-size: 2.6vw; color: #ffd166; }
  #aimhud.none { border-color: rgba(255, 107, 107, 0.7); color: #ff9b9b; }
  #aimhud.none b { color: #ff6b6b; }
  /* My card sits on the very top edge, small (imad 2026-11-26: "the top right black box takes too much space"). */
  #card { position: fixed; top: auto; bottom: calc(9px + 1.85vw * var(--ui)); right: 5px; width: 15vw; padding: 0.45vw 0.9vw 0.55vw; background: rgba(8, 10, 14, 0.6); border-radius: 0.8vw; font-size: 0.95vw; line-height: 1.3; }
  [dir="rtl"] #card { right: auto; left: 5px; }
  #card .pn { font-size: 1.15vw; line-height: 1.2; }
  #card .pbars { gap: 0.15vw; margin: 0.25vw 0 0.1vw; }
  #card .nl { width: 4.2vw; font-size: 0.85vw; }
  #card .nt { height: 0.5vw; }
  #card .pa { margin: 0.15vw 0 0; }
  #card .pa:empty { display: none; }
  /* The chat log, bottom left (imad 2026-11-26): text only, last 4 lines, small. */
  #chatlog { position: fixed; left: 1.2vw; bottom: 1.2vw; width: 36vw; pointer-events: none; z-index: 3; font: 500 1vw/1.35 system-ui, sans-serif; color: #f2f4f6;
    text-shadow: 0 0 0.25vw #000, 0 0.08vw 0.15vw #000, 0 0 0.1vw #000; }
  #chatlog div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transition: opacity 1s; }
  #chatlog b { color: #ffd166; font-weight: 700; }
  #chatlog .sys { color: #9fd8ff; }
  #chatlog .old { opacity: 0.55; }
  [dir="rtl"] #chatlog { left: auto; right: 1.2vw; }
  .replaying #chatlog, .menu-open #chatlog { display: none; }
  .pn { font-size: 1.7vw; font-weight: 600; }
  .ps, .pm { color: #c9d1d9; }
  .pa { color: #ffd166; margin: 0.3vw 0; }
  .pa.cold { color: #9fd8ff; }
  .pm b { color: #fff; }
  .pbars { display: flex; flex-direction: column; gap: 0.35vw; margin: 0.5vw 0; }
  .pbar { height: 0.7vw; background: rgba(255, 255, 255, 0.12); border-radius: 0.4vw; overflow: hidden; margin-top: 0.3vw; }
  .pbar i { display: block; height: 100%; border-radius: 0.4vw; background: #ff9ec7; }
  .nb { display: flex; align-items: center; gap: 0.6vw; }
  .nl { width: 6.5vw; color: #9aa3ad; font-size: 1.1vw; }
  .nt { flex: 1; height: 0.7vw; background: rgba(255, 255, 255, 0.12); border-radius: 0.4vw; overflow: hidden; }
  .nt i { display: block; height: 100%; border-radius: 0.4vw; }
  #gmenu { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 46vw; max-height: 84vh; display: flex; flex-direction: column;
    background: rgba(12, 15, 20, 0.94); border: 0.15vw solid rgba(255, 209, 102, 0.35); border-radius: 1.4vw; padding: 1.6vw 1.8vw; box-shadow: 0 1vw 3vw rgba(0, 0, 0, 0.5); }
  #gmenu[hidden], #card[hidden], .bub[hidden], .bub .bb[hidden] { display: none; }
  #gmenu.wide { width: 72vw; }
  #gmenu.wide .mx { max-height: 62vh; font-size: 1.2vw; }
  #gmenu .pn { display: none; }
  #gmenu .pbars { display: grid; grid-template-columns: 1fr 1fr; column-gap: 2.5vw; }
  #gmenu .pm { margin-top: 0.35vw; }
  #gmenu .mt { font-size: 2.3vw; font-weight: 600; margin-bottom: 0.8vw; color: #ffd166; }
  #gmenu .mx { font-size: 1.3vw; color: #c9d1d9; margin-bottom: 1vw; line-height: 1.5; max-height: 40vh; overflow: hidden; }
  #note { z-index: 5; white-space: pre-line; }
  #replay { position: fixed; left: 2vw; right: 2vw; top: 1.5vw; padding: 1vw 1.4vw; background: rgba(8, 10, 14, 0.8); border-radius: 1vw; font-size: 1.3vw; }
  .rp-t { font-size: 1.7vw; font-weight: 600; color: #ffd166; }
  .rp-bar { height: 0.6vw; background: rgba(255, 255, 255, 0.15); border-radius: 0.3vw; margin: 0.6vw 0; overflow: hidden; }
  .rp-bar i { display: block; height: 100%; background: #ffd166; }
  .rp-s { display: flex; justify-content: space-between; gap: 2vw; color: #c9d1d9; }
  .rp-people { display: flex; flex-wrap: wrap; gap: 0.4vw 1.6vw; margin-top: 0.5vw; color: #c9d1d9; }
  .rp-p b { color: #fff; }
  .bag { display: flex; flex-wrap: wrap; gap: 0.5vw 0.8vw; margin: 0.4vw 0 0.8vw; }
  .bag .bi { background: rgba(255, 255, 255, 0.08); border-radius: 0.6vw; padding: 0.3vw 0.8vw; }
  .bag .bi b { color: #ffd166; }
  /* bag & crafting, gear (invui.ts) */
  #gmenu.big { width: 88vw; max-height: 94vh; background: rgba(17, 19, 24, 0.97); }
  #gmenu.big .mx { max-height: none; overflow: visible; font-size: 1.15vw; margin-bottom: 0; }
  #gmenu.big .ml { display: none; }
  .inv .tabs { display: flex; gap: 0.6vw; margin-bottom: 0.7vw; }
  .tb { display: flex; align-items: center; gap: 0.4vw; padding: 0.25vw 0.9vw; border-radius: 0.6vw; background: rgba(255, 255, 255, 0.06); font-size: 1.3vw; }
  .tb i { width: 2.5vw; height: 2.5vw; display: inline-block; }
  .tb.cur { background: rgba(255, 209, 102, 0.18); color: #ffd166; }
  .tb.on, .sl.on, .gs.on, .go.on, .gb.on { outline: 0.25vw solid #ffd166; outline-offset: 0.1vw; }
  .box { background: rgba(0, 0, 0, 0.28); border: 0.12vw solid rgba(255, 255, 255, 0.08); border-radius: 0.8vw; padding: 0.5vw 0.8vw 0.7vw; }
  .bt { font-size: 1vw; color: #9aa3ad; margin-bottom: 0.4vw; text-transform: uppercase; letter-spacing: 0.08vw; }
  .r1 { display: flex; gap: 1vw; margin-bottom: 0.7vw; }
  .cr { display: flex; align-items: center; gap: 1vw; }

  .bg { display: grid; grid-template-columns: repeat(9, 4.2vw); gap: 0.35vw; }
  .arr { font-size: 2.4vw; color: #ffd166; }

    box-shadow: inset 0 0.2vw 0.4vw rgba(0, 0, 0, 0.45); display: flex; align-items: center; justify-content: center; box-sizing: border-box; flex: none; }

  .ds { margin-top: 0.6vw; display: flex; gap: 1.2vw; align-items: baseline; font-size: 1.3vw; } .ds b { color: #ffd166; }
  .nv { margin-top: 0.4vw; font-size: 1vw; color: #7d8590; }

  .gbig { display: flex; gap: 1vw; align-items: center; margin-bottom: 0.8vw; font-size: 1.25vw; }

  /* Text and menu size (Settings, imad 2026-11-25): --ui scales the bars and menus, --uib the big screens (capped).
