<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>World control panel</title>
<style>
:root{--bg:#14161a;--fg:#e6e6e6;--card:#1f232a;--acc:#4da3ff}
body{margin:0;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif;padding:16px}
.card{background:var(--card);border-radius:8px;padding:12px 16px;margin-bottom:12px;max-width:720px}
button{background:#2b3240;color:var(--fg);border:1px solid #3b4456;border-radius:6px;padding:8px 12px;margin:2px;font-size:15px}
button:hover{border-color:var(--acc)}input{background:#0e1014;color:var(--fg);border:1px solid #3b4456;border-radius:6px;padding:8px;width:min(420px,100%)}
pre{white-space:pre-wrap;margin:0;font:13px ui-monospace,monospace}
</style></head><body>
<h2>World control panel</h2>
<div class="card" id="login"><p>Admin token</p><input id="token" type="password" autocomplete="off"> <button id="go">Connect</button></div>
<div id="main" hidden>
  <div class="card">Connection: <span id="state">-</span></div>
  <div class="card"><b>Time</b><br>
    <button id="pause">Pause</button><button id="resume">Resume</button>
    <button data-speed="1">x1</button><button data-speed="2">x2</button><button data-speed="5">x5</button>
    <button data-speed="10">x10</button><button data-speed="25">x25</button><button data-speed="50">x50</button><button data-speed="100">x100</button>
    <button id="snap">Save snapshot now</button></div>
  <div class="card"><b>Server</b><pre id="stats">-</pre></div>
  <div class="card"><b>Log</b><pre id="log"></pre></div>
</div>
<script type="module" src="panel.js"></script></body></html>
