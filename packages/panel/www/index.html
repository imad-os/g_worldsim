<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14161a">
<title>World control panel</title>
<style>
:root{--bg:#14161a;--fg:#e8e8e8;--dim:#9aa3ad;--card:#1f232a;--line:#323946;--acc:#4da3ff;--ok:#3ecf8e;--bad:#ff6b6b;--warn:#ffb020}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px system-ui,sans-serif;padding:16px;max-width:760px;margin:auto}
h2{margin:4px 0 14px;font-size:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.card.alert{border-color:var(--warn)}
.card h3{margin:0 0 8px;font-size:15px;color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
button{background:#2b3240;color:var(--fg);border:1px solid #3b4456;border-radius:8px;padding:10px 14px;margin:3px 3px 3px 0;font-size:15px;min-height:44px}
button.primary{background:var(--acc);border-color:var(--acc);color:#04121f;font-weight:600}
input,select{background:#0e1014;color:var(--fg);border:1px solid #3b4456;border-radius:8px;padding:10px;font-size:16px;min-height:44px;max-width:100%}
#token{width:100%}
pre{white-space:pre-wrap;margin:0;font:13px ui-monospace,monospace;color:#cfd6de}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row input{width:150px}
.code{font:600 24px ui-monospace,monospace;letter-spacing:.12em}
.dim{color:var(--dim);font-size:14px}
.ok{color:var(--ok)}.bad{color:var(--bad)}
a{color:var(--acc);word-break:break-all}
.top{display:flex;justify-content:space-between;align-items:center}
</style></head><body>
<div class="top"><h2>World control panel</h2><span id="state" class="dim"></span></div>
<div class="card" id="login" hidden><h3>Sign in</h3>
  <p class="dim">Admin token (ADMIN_TOKEN in the server's .env). This device remembers it.</p>
  <input id="token" type="password" autocomplete="current-password" aria-label="Admin token"> <button id="go" class="primary">Sign in</button>
  <p id="loginMsg" class="bad"></p></div>
<div id="main" hidden>
  <div class="card" id="pairsCard"><h3>TVs waiting</h3><div id="pairs"></div></div>
  <div class="card"><h3>Time</h3><b id="time">-</b><br>
    <button id="pause">Pause</button><button id="resume">Resume</button>
    <button data-speed="1">x1</button><button data-speed="2">x2</button><button data-speed="5">x5</button>
    <button data-speed="10">x10</button><button data-speed="25">x25</button><button data-speed="100">x100</button></div>
  <div class="card"><h3>Players</h3><div id="players"></div></div>
  <div class="card"><h3>Internet link</h3><div id="url">-</div><p class="dim" id="tunnelState"></p>
    <select id="provider" aria-label="Tunnel">
      <option value="ngrok">ngrok</option><option value="tailscale">Tailscale Funnel</option>
      <option value="cloudflare">Cloudflare (own domain)</option><option value="cloudflare-quick">Cloudflare quick link</option>
      <option value="none">Off (this PC only)</option></select>
    <button id="switch">Switch</button></div>
  <div class="card"><h3>Server</h3><pre id="stats">-</pre><button id="snap">Save snapshot now</button><button id="logout">Sign out</button></div>
  <div class="card"><h3>Log</h3><pre id="log"></pre></div>
</div>
<script type="module" src="panel.js"></script></body></html>
